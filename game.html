<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>성경 타이핑 연습</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Square:wght@400;700;800&display=swap" rel="stylesheet">

<style>
  html {
    zoom: 0.8;
    -moz-transform: scale(0.8);
    -moz-transform-origin: top center;
  }

  body { 
    font-family: 'Nanum Square', sans-serif; 
    background-color: #f0f2f5; 
    margin: 0;
    padding: 60px 20px;
    color: #2d3436;
  }

  .box { 
    background: #ffffff; 
    max-width: 1000px; 
    margin: auto; 
    padding: 60px; 
    border-radius: 40px; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
    position: relative;
    text-align: left;
  }

  .header-area {
    border-left: 6px solid #3498db; 
    padding-left: 20px;
    margin-bottom: 50px;
  }

  h1 { 
    font-size: 52px; 
    font-weight: 800;
    margin: 0;
    color: #2d3436;
    letter-spacing: -1.5px;
  }

  h1 span { color: #3498db; }

  #reference { 
    display: inline-block;
    background: #edf2f7;
    padding: 6px 15px;
    border-radius: 8px;
    color: #4a5568; 
    font-size: 20px; 
    font-weight: 700;
    margin-bottom: 20px;
  }

  #verse { 
    font-family: 'Nanum Myeongjo', serif;
    font-size: 40px; 
    line-height: 1.7; 
    margin-bottom: 40px; 
    word-break: keep-all; 
    min-height: 120px;
    color: #2d3436;
  }

  .correct { color: #2d3436; }
  .wrong { color: #e74c3c; border-bottom: 3px solid #e74c3c; }
  .remaining { color: #ced4da; }
  
  textarea { 
    font-family: 'Nanum Myeongjo', serif; 
    width: 100%; 
    height: 160px; 
    font-size: 28px; 
    padding: 25px; 
    border: 2px solid #e2e8f0; 
    border-radius: 24px; 
    resize: none; 
    box-sizing: border-box; 
    outline: none; 
    background-color: #f8fafc;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  textarea:focus { 
    border-color: #3498db; 
    background-color: #fff;
    box-shadow: 0 10px 25px rgba(52, 152, 219, 0.1);
  }
  
  .footer-stats {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 40px;
  }

  #stats { 
    display: flex; 
    gap: 40px; 
    font-size: 24px; 
    font-weight: 700; 
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .stat-label {
    font-size: 14px;
    color: #a0aec0;
    text-transform: uppercase;
  }

  .stat-value { color: #2d3436; }

  .avg-box {
    padding: 20px 30px;
    background: #2d3436;
    border-radius: 20px;
    color: #fff;
    text-align: center;
  }

  .avg-title { font-size: 13px; color: #b2bec3; margin-bottom: 8px; font-weight: 700; }
  .avg-values { font-size: 22px; font-weight: 700; }
  .avg-values span { color: #3498db; }

  #result { margin-top: 20px; font-size: 20px; font-weight: 700; height: 24px; color: #adb5bd; }
  .hint { margin-top: 15px; color: #a0aec0; font-size: 15px; }
</style>
</head>
<body>

<div class="box">
  <div class="header-area">
    <h1><span>랜덤</span> 성경구절 타자 연습</h1>
  </div>

  <div id="reference"></div>
  <div id="verse"></div>
  
  <textarea id="input" 
            placeholder="말씀을 입력하며 묵상해 보세요..." 
            spellcheck="false" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off"></textarea>
  <div id="result"></div>
  <div class="hint">구절 끝까지 입력 후 <b>Space</b> 또는 <b>Enter</b>를 눌러 다음으로 이동</div>

  <div class="footer-stats">
    <div id="stats">
      <div class="stat-item">
        <span class="stat-label">Current Speed</span>
        <span class="stat-value"><span id="cpm">0</span> 타/분</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Accuracy</span>
        <span class="stat-value"><span id="accuracy">100</span>%</span>
      </div>
    </div>

    <div class="avg-box">
      <div class="avg-title">RECENT 10 AVG</div>
      <div class="avg-values">
        <span id="avg-cpm">0</span> 타/분 · <span id="avg-accuracy">0</span>%
      </div>
    </div>
  </div>
</div>

<script>
let verses = [];
let currentVerse = "";
let startTime = null;
let history = []; 

const referenceBox = document.getElementById("reference");
const verseBox = document.getElementById("verse");
const input = document.getElementById("input");
const result = document.getElementById("result");
const cpmBox = document.getElementById("cpm");
const accuracyBox = document.getElementById("accuracy");
const avgCpmBox = document.getElementById("avg-cpm");
const avgAccuracyBox = document.getElementById("avg-accuracy");

function getHangulStrokeCount(text) {
  let count = 0;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      const n = code - 0xAC00;
      const jong = n % 28;
      count += (jong > 0) ? 3 : 2; 
    } else {
      count += 1;
    }
  }
  return count;
}

fetch("개역개정4판(구약+신약).txt")
  .then(res => res.text())
  .then(text => {
    verses = text.split("\n").map(v => v.trim()).filter(v => v !== "");
    nextVerse();
  })
  .catch(err => {
    console.error("파일을 불러올 수 없습니다:", err);
    verseBox.textContent = "텍스트 파일을 찾을 수 없습니다.";
  });

function nextVerse() {
  if (verses.length === 0) return;
  const randomIndex = Math.floor(Math.random() * verses.length);
  const line = verses[randomIndex];
  const firstSpace = line.indexOf(" ");
  let reference = line.substring(0, firstSpace);
  let content = line.substring(firstSpace + 1).replace(/<[^>]*>/g, "").trim();

  currentVerse = content;
  referenceBox.textContent = reference;
  input.value = "";
  result.textContent = "";
  startTime = null;
  updateVerseDisplay();
  cpmBox.textContent = "0";
  accuracyBox.textContent = "100";
  input.focus();
}

function updateVerseDisplay() {
  const typed = input.value;
  let html = "";
  for (let i = 0; i < currentVerse.length; i++) {
    const original = currentVerse[i];
    const typedChar = typed[i];
    if (typedChar == null) html += `<span class="remaining">${original}</span>`;
    else if (typedChar === original) html += `<span class="correct">${original}</span>`;
    else html += `<span class="wrong">${original}</span>`;
  }
  verseBox.innerHTML = html;
}

function calculateStats() {
  const value = input.value;
  if (!startTime || value.length === 0) return { cpm: 0, accuracy: 100 };
  
  let correctCharCount = 0;
  for (let i = 0; i < value.length; i++) {
    if (value[i] === currentVerse[i]) correctCharCount++;
  }
  const accuracy = Math.round((correctCharCount / value.length) * 100);
  const now = new Date();
  const seconds = (now - startTime) / 1000;
  let cpm = 0;
  if (seconds > 0.3) {
    const totalStrokes = getHangulStrokeCount(value);
    cpm = Math.round((totalStrokes / seconds) * 60);
  }
  return { cpm, accuracy };
}

input.addEventListener("input", () => {
  if (input.value.length === 0) {
    startTime = null;
    cpmBox.textContent = "0";
    accuracyBox.textContent = "100";
  } else if (!startTime) {
    startTime = new Date();
  }
  
  const stats = calculateStats();
  cpmBox.textContent = stats.cpm;
  accuracyBox.textContent = stats.accuracy;
  updateVerseDisplay();
});

input.addEventListener("keydown", (e) => {
  const isFinished = input.value.length >= currentVerse.length;
  if (e.key === "Enter" || (e.key === " " && isFinished)) {
    e.preventDefault();
    const stats = calculateStats();
    if (input.value.length >= 5) {
      history.push({ cpm: stats.cpm, acc: stats.accuracy });
      if (history.length > 10) history.shift();
      const avgCpm = Math.round(history.reduce((sum, item) => sum + item.cpm, 0) / history.length);
      const avgAcc = Math.round(history.reduce((sum, item) => sum + item.acc, 0) / history.length);
      avgCpmBox.textContent = avgCpm;
      avgAccuracyBox.textContent = avgAcc;
    }
    result.textContent = "다음 구절 준비 중...";
    setTimeout(nextVerse, 500);
  }
});
</script>
</body>
</html>
